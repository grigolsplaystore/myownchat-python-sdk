[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myownchat"
version = "0.1.0"
description = "MyOwnChat AI Agent Messaging Gateway & SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "MyOwnChat Team", email = "support@marcvali.org" }
]
keywords = ["myownchat", "ai-agent", "hermes-agent", "gateway", "sse", "littlebackend", "chat-bot"]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
myownchat-gateway = "myownchat.cli:main"

[project.urls]
Homepage = "https://myownchat.app"
Repository = "https://github.com/myownchat/myownchat"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "UP007", # Use X | Y for type annotations (Python 3.10+)
    "UP045", # Use X | None for type annotations (Python 3.10+)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
